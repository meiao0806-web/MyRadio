; ============================================================
;  MyRadio —— 极简网络收音机固件（ESP32-S3 + ST7789 320x170）
;  一颗旋钮只调台；其余全部交给手机 App；高度适老化
;
;  烧录：pio run -t upload
;  串口：pio device monitor -b 115200
; ============================================================
[platformio]
default_envs = myradio

[env:myradio]
platform  = espressif32@6.9.0          ; Arduino core 2.0.17 / IDF 4.4
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size   = 16MB
board_build.partitions   = partitions.csv
board_build.filesystem   = littlefs
board_upload.flash_size  = 16MB
board_upload.maximum_size = 4194304

; N16R8（8MB 八线 PSRAM）用 qio_opi；若烧完不启动，改成 qio_qspi 再试
board_build.arduino.memory_type = qio_opi

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    ; ---------- 板型：ESP32-S3 + SI4732 + SPI 屏（宏名沿用 BOARD_ATSMINI）----------
    ; 对应 oshwhub sunnygold/esp32s3-si4732-shou-yin-ji 的成品机，自带 PCM5102。
    ; 换到别的板子就删掉这一行，config.h 会回到默认引脚（16/17/15 的 I2S、无 FM）
    -DBOARD_ATSMINI=1

    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ---------- TFT_eSPI：全部用编译宏配置，不需要改 User_Setup.h ----------
    -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  ; ---- 1.32.0：屏幕是 **8 位并口(8080)**，不是 SPI！----
  ; 依据：原厂随附源码 libraries/TFT_eSPI_DynamicSpeed/User_Setup_Select.h 第 133 行
  ;   #include <User_Setups/Setup206_LilyGo_T_Display_S3.h>
  ; 而 Setup206 里明确写着 TFT_PARALLEL_8_BIT + 下面这套引脚。
  ; 之前所有「扫 SPI 引脚」的努力全都打在一个不听 SPI 的屏上，所以必然全黑。
  -DTFT_PARALLEL_8_BIT=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_CS=6
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  ; 1.43.0：**故意不再定义** TFT_BL / TFT_BACKLIGHT_ON —— 背光改由 ui.cpp 独占。
  ;   原因：TFT_eSPI::init() 结尾（库源码 TFT_eSPI.cpp:786）有这么一段
  ;     #if defined (TFT_BL) && defined (TFT_BACKLIGHT_ON)
  ;       pinMode(TFT_BL, OUTPUT);
  ;       digitalWrite(TFT_BL, TFT_BACKLIGHT_ON);   // ← 库自己把背光点亮
  ;   它抢在「我们发 DISPOFF、清显存」之前就把背光拉满，而那一刻 ST7789
  ;   显存还是上电随机内容 ⇒ 开屏白闪一下。1.38.1 只在自家代码里按灭背光，
  ;   管不到库里这一句，所以白闪一直没消。
  -DPIN_TFT_BL=38
  -DBL_ON_LEVEL=HIGH
  -DTFT_INVERSION_ON=1
  -DCGRAM_OFFSET=1
  -DINIT_SEQUENCE_3=1
  -DTFT_RGB_ORDER=TFT_RGB
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT7=1   ; 1.38.0：48px 七段数码（收音频率大字，原厂同款）

; ⚠️ 1.16.0 起不再从 GitHub 拉 ESP32-audioI2S，改用仓库内的 lib/ESP32-audioI2S
;    （= 上游 2.0.6 + 两行补丁，搜 Audio.cpp 里的「MyRadio 1.16.0 补丁」）。
;    为什么：蜻蜓 FM 的点播音频是 m4a，但 CDN 把 Content-Type 标成 audio/mpeg，
;    库只按 Content-Type 判格式 ⇒ 会当 mp3 解码、整集没声音。补丁让「URL 里带 .m4a」
;    时按 M4A 处理；条件不命中时行为与上游完全一致（只在「URL 里出现 .m4a」时才走新分支）。
;    将来升级音频库：把上游新的 Audio.cpp 覆盖进来，再把那两处补丁贴回去。
;    上游原地址：https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ============================================================
;  硬件自检环境（1.21.1）
;  只用来确认 I2S 引脚在哪三个脚。编出来的固件不联网、不读存储，
;  开机就依次用 10 组候选引脚各播 4 秒 1kHz 正弦。
;
;     pio run -e hwtest -t upload
;     串口 115200 会打印 "组 N/10 : BCK=.. WS=.. DIN=.."，
;     听到声音就记下编号，然后改 config.h 的 PIN_I2S_* 三行。
; ============================================================
[env:hwtest]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size   = 16MB
board_build.partitions   = partitions.csv
board_build.filesystem   = littlefs
board_upload.flash_size  = 16MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_opi

monitor_speed   = 115200
upload_speed    = 921600

build_flags =
    -DBOARD_ATSMINI=1
    -DHWTEST=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  ; ---- 1.32.0：屏幕是 **8 位并口(8080)**，不是 SPI！----
  ; 依据：原厂随附源码 libraries/TFT_eSPI_DynamicSpeed/User_Setup_Select.h 第 133 行
  ;   #include <User_Setups/Setup206_LilyGo_T_Display_S3.h>
  ; 而 Setup206 里明确写着 TFT_PARALLEL_8_BIT + 下面这套引脚。
  ; 之前所有「扫 SPI 引脚」的努力全都打在一个不听 SPI 的屏上，所以必然全黑。
  -DTFT_PARALLEL_8_BIT=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_CS=6
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  ; 1.43.0：**故意不再定义** TFT_BL / TFT_BACKLIGHT_ON —— 背光改由 ui.cpp 独占。
  ;   原因：TFT_eSPI::init() 结尾（库源码 TFT_eSPI.cpp:786）有这么一段
  ;     #if defined (TFT_BL) && defined (TFT_BACKLIGHT_ON)
  ;       pinMode(TFT_BL, OUTPUT);
  ;       digitalWrite(TFT_BL, TFT_BACKLIGHT_ON);   // ← 库自己把背光点亮
  ;   它抢在「我们发 DISPOFF、清显存」之前就把背光拉满，而那一刻 ST7789
  ;   显存还是上电随机内容 ⇒ 开屏白闪一下。1.38.1 只在自家代码里按灭背光，
  ;   管不到库里这一句，所以白闪一直没消。
  -DPIN_TFT_BL=38
  -DBL_ON_LEVEL=HIGH
  -DTFT_INVERSION_ON=1
  -DCGRAM_OFFSET=1
  -DINIT_SEQUENCE_3=1
  -DTFT_RGB_ORDER=TFT_RGB
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT7=1   ; 1.38.0：48px 七段数码（收音频率大字，原厂同款）

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
